version: '3.8'

services:
  watson:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: watson-agent
    restart: always
    ports:
      - "${PORT:-8000}:8000"
    env_file:
      - .env
    volumes:
      # 1. SQLite 세션 및 대화 DB 파일 영속화
      - ./app.db:/app/app.db
      # 2. 시스템 설정 디렉토리 (GTD 경로, 출근길, 텔레그램 메뉴 설정) 영속화
      - ./config:/app/config
      # 3. 마크다운 라이프로그 및 GTD 저장소 영속화
      - ${GTD_PATH:-./lifelogs}:/app/lifelogs
      # 4. 호스트 Git 설정 및 SSH 키 안전 공유 (GitHub Push 자동화용)
      - ~/.gitconfig:/root/.gitconfig:ro
      - ~/.ssh:/root/.ssh:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
