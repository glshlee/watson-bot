<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watson - 24/7 AI Agent Console</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="logo">
                <i class="fa-solid fa-brain-circuit"></i>
                <h2>Watson <span>Agent</span></h2>
            </div>
            
            <div class="session-section">
                <div class="session-header">
                    <span><i class="fa-solid fa-comments"></i> 대화 세션 목록</span>
                    <button id="new-session-btn" title="새 세션 시작"><i class="fa-solid fa-plus"></i></button>
                </div>
                <div id="session-list" class="session-list">
                    <!-- Dynamic Sessions -->
                </div>
            </div>

            <div class="system-status">
                <div class="status-indicator online"></div>
                <div class="status-info">
                    <p class="status-title">Agent 24/7 Active</p>
                    <p class="status-sub">Git Sync & Context Memory</p>
                </div>
            </div>
        </aside>

        <!-- Main Chat Area -->
        <main class="main-content">
            <!-- Header Bar -->
            <header class="top-header">
                <div class="header-title">
                    <h1 id="chat-title">AI 에이전트 인터랙티브 콘솔</h1>
                    <p id="chat-subtitle">웹상에서 AI와 직접 대화하며 마크다운 기록 및 GitHub 자동 푸시</p>
                </div>
                <div class="user-profile">
                    <span class="badge">AGY / LLM Engine</span>
                    <i class="fa-brands fa-github avatar"></i>
                </div>
            </header>

            <!-- Chat Console Area -->
            <div class="chat-console-wrapper">
                <div id="chat-messages" class="chat-messages-container">
                    <div class="message assistant">
                        <div class="avatar"><i class="fa-solid fa-robot"></i></div>
                        <div class="bubble">
                            안녕하세요! 왓슨 24/7 AI 라이프 로그 에이전트입니다. 🤖<br>
                            오늘 일어난 일이나 일기, 운동 기록, 생각을 자유롭게 말씀해 주세요! 대화 내용을 정제하여 마크다운 파일에 기록하고 깃허브에 커밋/푸시해 드립니다.
                        </div>
                    </div>
                </div>

                <!-- Input Box Bar -->
                <div class="chat-input-wrapper">
                    <div class="category-bar">
                        <label><i class="fa-solid fa-tag"></i> 로그 범주:</label>
                        <select id="category-select">
                            <option value="Daily Notes & Diary">📝 Daily Notes & Diary</option>
                            <option value="Workout & Health">🏋️ Workout & Health</option>
                            <option value="Ideas & Thoughts">💡 Ideas & Thoughts</option>
                        </select>
                        <span id="push-status-badge" class="push-status-badge"><i class="fa-solid fa-code-commit"></i> Auto Git Push</span>
                    </div>
                    <div class="input-row">
                        <textarea id="chat-input" placeholder="Watson에게 메시지를 보내보세요... (예: 오늘 저녁 파이썬 웹 대시보드 개발 2시간 완료함!)"></textarea>
                        <button id="send-btn" class="btn-primary">
                            <i class="fa-solid fa-paper-plane"></i> 전송
                        </button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="/static/js/main.js"></script>
</body>
</html>
