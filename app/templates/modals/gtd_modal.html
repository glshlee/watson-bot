<!-- GTD Directory Settings Modal (ADR-007) -->
<div id="gtd-modal" class="modal hidden">
    <div class="modal-content">
        <div class="modal-header">
            <h3><i class="fa-solid fa-folder-gear"></i> GTD 관리 디렉토리 설정</h3>
            <button id="close-gtd-modal-btn" class="close-btn">&times;</button>
        </div>
        <div class="modal-body">
            <p class="modal-desc">왓슨 봇 엔진과 분리하여 GTD/라이프로그를 관리할 외부 디렉토리 또는 Git 저장소 경로를 지정합니다.</p>
            <div class="form-group">
                <label for="gtd-path-input">디렉토리 경로 (절대/상대 경로):</label>
                <input type="text" id="gtd-path-input" placeholder="/home/ubuntu/workspace/life_log" />
            </div>
            <div id="gtd-modal-status" class="gtd-status-box"></div>
        </div>
        <div class="modal-footer">
            <button id="cancel-gtd-btn" class="btn-secondary">취소</button>
            <button id="save-gtd-btn" class="btn-primary">저장 및 적용</button>
        </div>
    </div>
</div>
