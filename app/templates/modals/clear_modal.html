<!-- Clear Messages Modal (ADR-017) -->
<div id="clear-modal" class="modal hidden">
    <div class="modal-content">
        <div class="modal-header">
            <h3><i class="fa-solid fa-broom" style="color:#f59e0b"></i> 대화 내용 비우기</h3>
            <button id="close-clear-modal-btn" class="close-btn">&times;</button>
        </div>
        <div class="modal-body">
            <p class="modal-desc">현재 세션의 모든 메시지 내역을 비우시겠습니까? 세션 자체는 유지됩니다.</p>
        </div>
        <div class="modal-footer">
            <button id="cancel-clear-btn" class="btn-secondary">취소</button>
            <button id="confirm-clear-btn" class="btn-warning"><i class="fa-solid fa-broom"></i> 비우기</button>
        </div>
    </div>
</div>
